<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        LifeOS AI
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/profile.css') }}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f6f9;

        }
        .flash-container{

    width:90%;

    max-width:900px;

    margin:20px auto;

}
        input,
        textarea,
        select{

            width:100%;

            padding:10px;

            margin-top:8px;

            margin-bottom:18px;

            border:1px solid #ccc;

            border-radius:6px;

        }

        input[type="submit"],
        button{

            width:100%;

            padding:12px;

            border:none;

            border-radius:6px;

            background:#2563eb;

            color:white;

            cursor:pointer;

            font-size:16px;

        }

        input[type="submit"]:hover,
        button:hover{

            background:#1d4ed8;

        }

        a{

            text-decoration:none;

            color:#2563eb;

        }

        .flash{

            padding:12px;

            margin-bottom:15px;

            border-radius:6px;

            background:#d1fae5;

            color:#065f46;

        }

    </style>

    {% block extra_css %}
    {% endblock %}

<body>
{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        <div class="flash-container">

        {% for category, message in messages %}

            <div class="flash">

                {{ message }}

            </div>

        {% endfor %}

        </div>

    {% endif %}

{% endwith %}

{% block content %}
{% endblock %}
    
</body>

</html>
