<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Note | LifeOS AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",Arial,sans-serif;
}

body{

    background:#eef3ff;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

}

.container{

    width:100%;
    max-width:760px;

    background:white;

    border-radius:22px;

    padding:35px;

    box-shadow:0 15px 40px rgba(0,0,0,.12);

    animation:fade .5s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.header{

    text-align:center;

    margin-bottom:30px;

}

.header h1{

    color:#2563eb;

    font-size:34px;

    margin-bottom:8px;

}

.header p{

    color:#64748b;

    font-size:15px;

}

.form-group{

    margin-bottom:22px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#1e293b;

}

input[type=text]{

    width:100%;

    padding:14px;

    border:2px solid #dbeafe;

    border-radius:12px;

    outline:none;

    font-size:15px;

    transition:.3s;

}

textarea{

    width:100%;

    padding:14px;

    border:2px solid #dbeafe;

    border-radius:12px;

    resize:vertical;

    min-height:220px;

    outline:none;

    font-size:15px;

    transition:.3s;

}

input:focus,
textarea:focus{

    border-color:#2563eb;

    box-shadow:0 0 15px rgba(37,99,235,.2);

}

.button-group{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:30px;

}

.btn{

    text-decoration:none;

    padding:13px 30px;

    border:none;

    border-radius:12px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.save{

    background:#2563eb;

    color:white;

}

.save:hover{

    background:#1d4ed8;

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(37,99,235,.25);

}

.cancel{

    background:#e5e7eb;

    color:#111827;

}

.cancel:hover{

    background:#cbd5e1;

    transform:translateY(-3px);

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📝 Add New Note</h1>

<p>Create and organize your ideas with LifeOS AI.</p>

</div>

<form method="POST">

{{ form.hidden_tag() }}

<div class="form-group">

{{ form.title.label }}

{{ form.title() }}

</div>

<div class="form-group">

{{ form.content.label }}

{{ form.content(rows=10) }}

</div>

<div class="button-group">

{{ form.submit(class="btn save", value="💾 Save Note") }}

<a href="{{ url_for('notes.all_notes') }}" class="btn cancel">

⬅ Back

</a>

</div>

</form>

</div>

</body>

</html>
