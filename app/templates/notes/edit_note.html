<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Note | LifeOS AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
}

body{
    background:#eef3ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{

    width:100%;
    max-width:750px;

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:0 15px 40px rgba(0,0,0,.12);

}

.title{

    text-align:center;

    color:#2563eb;

    margin-bottom:30px;

}

.title h1{

    font-size:32px;

}

.title p{

    color:#666;

    margin-top:8px;

}

.form-group{

    margin-bottom:22px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#1e293b;

}

input[type=text]{

    width:100%;

    padding:14px;

    border:2px solid #dbeafe;

    border-radius:10px;

    font-size:15px;

    outline:none;

    transition:.3s;

}

textarea{

    width:100%;

    padding:14px;

    border:2px solid #dbeafe;

    border-radius:10px;

    resize:none;

    font-size:15px;

    outline:none;

    transition:.3s;

}

input:focus,
textarea:focus{

    border-color:#2563eb;

    box-shadow:0 0 12px rgba(37,99,235,.2);

}

.button-group{

    display:flex;

    gap:15px;

    justify-content:center;

    margin-top:30px;

}

.btn{

    text-decoration:none;

    border:none;

    padding:14px 28px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    transition:.3s;

}

.update{

    background:#2563eb;

    color:white;

}

.update:hover{

    background:#1d4ed8;

    transform:translateY(-3px);

}

.cancel{

    background:#e5e7eb;

    color:#111827;

}

.cancel:hover{

    background:#cbd5e1;

}

</style>

</head>

<body>

<div class="container">

<div class="title">

<h1>✏ Edit Note</h1>

<p>Update your note and save the changes.</p>

</div>

<form method="POST">

{{ form.hidden_tag() }}

<div class="form-group">

{{ form.title.label }}

{{ form.title() }}

</div>

<div class="form-group">

{{ form.content.label }}

{{ form.content(rows=10) }}

</div>

<div class="button-group">

{{ form.submit(class="btn update", value="💾 Update Note") }}

<a href="{{ url_for('notes.all_notes') }}" class="btn cancel">
Cancel
</a>

</div>

</form>

</div>

</body>

</html>
