<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LifeOS AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
height:100vh;
overflow:hidden;
background:#f5f5f5;
}

/* Sidebar */

.sidebar{

width:280px;
background:#202123;
color:white;
display:flex;
flex-direction:column;

}

.logo{

padding:20px;
font-size:24px;
font-weight:bold;
border-bottom:1px solid #333;

}

.new-chat{

padding:15px;

}

.new-chat a{

display:block;
text-decoration:none;
background:#10a37f;
padding:12px;
border-radius:8px;
text-align:center;
color:white;
font-weight:bold;

}

.sessions{

flex:1;
overflow-y:auto;

}

.session{

display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
border-bottom:1px solid #303030;

}

.session:hover{

background:#2b2d31;

}

.active{

background:#343541;

}

.session-title{

flex:1;
color:white;
text-decoration:none;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;

}

.session-actions{

display:flex;
gap:12px;
margin-left:10px;

}

.session-actions span{

cursor:pointer;
font-size:17px;

}

.session-actions a{

text-decoration:none;
color:#ff5c5c;

}

/* Main */

.main{

flex:1;
display:flex;
flex-direction:column;

}

.header{

height:65px;
background:white;
display:flex;
align-items:center;
padding-left:25px;
font-size:24px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.chat-box{

flex:1;
padding:25px;
overflow-y:auto;

}

.user{

text-align:right;
margin-bottom:20px;

}

.bot{

text-align:left;
margin-bottom:20px;

}

.user span{

display:inline-block;
background:#10a37f;
color:white;
padding:12px 18px;
border-radius:16px;
max-width:75%;
text-align:left;

}

.bot span{

display:inline-block;
background:white;
padding:12px 18px;
border-radius:16px;
max-width:75%;
box-shadow:0 0 8px rgba(0,0,0,.12);

}

.bottom{

display:flex;
gap:10px;
padding:18px;
background:white;
border-top:1px solid #ddd;

}

#message{

flex:1;
padding:14px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
outline:none;

}

button{

width:120px;
background:#10a37f;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#0d896b;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🤖 LifeOS AI
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">


    <a href="{{ url_for('dashboard.home') }}"
       style="
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
       ">
        🏠 Dashboard
    </a>

</div>
<div class="new-chat">

<a href="{{ url_for('ai.new_chat') }}">

➕ New Chat

</a>

</div>

<div class="sessions">

{% for session in sessions %}

<div class="session {% if session.id==current_session %}active{% endif %}">

<a
href="{{ url_for('ai.chat', session_id=session.id) }}"
class="session-title"
>

{{ session.title }}

</a>

<div class="session-actions">

<span onclick="renameChat({{ session.id }}, '{{ session.title }}')">

✏️

</span>

<a
href="{{ url_for('ai.delete_chat', id=session.id) }}"
onclick="return confirm('Delete this chat?')"
>

🗑

</a>

</div>

</div>

{% endfor %}

</div>

</div>

<div class="main">

<div class="header">

LifeOS AI Assistant

</div>

<div
class="chat-box"
id="chatBox"
>

{% for chat in chats %}

<div class="user">

<span>

{{ chat.question }}

</span>

</div>

<div class="bot">

<span>

{{ chat.answer }}

</span>

</div>

{% endfor %}

</div>

<div class="bottom">

<input
id="message"
placeholder="Ask anything..."
autocomplete="off"
>
<button id="mic-btn" type="button">
    🎤
</button>
<button onclick="sendMessage()">

Send

</button>

</div>

</div>

<script>

const sessionId={{ current_session }};

function renameChat(id, oldTitle){

let title=prompt("Rename Chat",oldTitle);

if(title==null)return;

title=title.trim();

if(title==="")return;

fetch("/ai/rename/"+id,{

method:"POST",

headers:{

"Content-Type":"application/x-www-form-urlencoded"

},

body:"title="+encodeURIComponent(title)

})

.then(()=>{

location.reload();

});

}

</script>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>

</html>
